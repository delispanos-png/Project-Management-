          example: Daily Virus Scanning
        value:
          $ref: "#/components/schemas/ConfigOptionValueType"
        sort_order:
          type: integer
          format: int32
          example: 2
        pricing:
          $ref: '#/components/schemas/Pricing'
      required:
        - name
        - value
        - pricing

    ServiceConfigOption:
      type: object
      properties:
        id:
          type: integer
          format: int64
          example: 456
        config_option:
          type: object
          properties:
            id:
              type: integer
              format: int64
              example: 12
            name:
              type: string
              minLength: 1
              example: Config Option Name
            type:
              $ref: "#/components/schemas/ConfigOptionType"
          required:
            - id
            - name
            - type
        service:
          type: object
          properties:
            id:
              type: integer
              format: int64
              example: 123
          required:
            - id
        option:
          type: object
          properties:
            name:
              type: string
              minLength: 1
              example: Config Option Name
            value:
              $ref: '#/components/schemas/ConfigOptionValueType'
        billing:
          $ref: '#/components/schemas/ServiceConfigOptionBilling'
      required:
        - id
        - config_option
        - option

    Domain:
      type: object
      properties:
        domain_name:
          type: string
      required:
        - domain_name

    LookupProviderSuggestionOption:
        type: object
        properties:
          lookup_provider:
            type: string
            description: the unique system name of the Lookup Provider
            example: WhmcsDomains
          maximum_length_supported:
            type: boolean
            description: if the Maximum Length property is supported by the Lookup Provider
          tld_override_supported:
            type: boolean
            description: if the TLD Override property is supported by the Lookup Provider
          sensitive_filter_override_supported:
            type: boolean
            description: if sensitive word filtering override is supported by the Lookup Provider
          maximum_term_length:
            type: integer
            description: the maximum length of the search term supported by the Lookup Provider
            format: int32
            example: 1500
            minimum: 3
            maximum: 1500
            nullable: true
          configured_suggestion_tlds:
            type: array
            description: an array of default TLDs configured for suggestions
            items:
              type: string
              example: com
            nullable: true
        required:
          - lookup_provider
          - maximum_length_supported
          - tld_override_supported
          - sensitive_filter_override_supported
          - configured_suggestion_tlds

    DomainSuggestionRequest:
      type: object
      properties:
        term:
          type: string
          description: domain, keyword, or phrase to use as the basis for suggestions depending on the Lookup Provider capabilities
          example: example.com, example, or 'A automotive repair shop in New York'
          minLength: 3
          maxLength: 1500
        tlds:
          type: array
          description: an optional array of top level domains (TLDs) to check for suggestions (not all Lookup Providers support this)
          items:
            type: string
            example: com
          minItems: 0
          maxItems: 255
          nullable: true
        maximum_length:
          type: integer
          description: the optional maximum number of characters for the suggested domain names (not all Lookup Providers support this)
          format: int32
          example: 10
          minimum: 3
          maximum: 63
          nullable: true
        filter_sensitive_content:
          type: boolean
          description: whether to filter out sensitive words from the suggestions (not all Lookup Providers support this)
          nullable: true
      required:
          - term

    DomainStatus:
      allOf:
        - $ref: "#/components/schemas/Domain"
        - type: object
          properties:
            idn_domain_name:
              type: string
            tld:
              type: string
            sld:
              type: string
            idn_sld:
              type: string
            status:
              type: string
              enum:
                - registered
                - available for registration
                - reserved
                - unknown
                - tld not supported
            group:
              type: string
              nullable: true
            pricing:
              type: array
              items:
                $ref: '#/components/schemas/DomainPricing'
            shortest_period:
              $ref: '#/components/schemas/DomainPricing'
            is_premium:
              type: boolean
            premium_cost_pricing:
              nullable: true
              allOf:
                - $ref: '#/components/schemas/DomainPricing'
          required:
            - idn_domain_name
            - sld
            - idn_sld
            - status
            - pricing
            - shortest_period
            - group
            - is_premium
            - premium_cost_pricing

    DomainRenewalPricing:
      type: object
      properties:
        period:
          type: integer
        pricing:
          nullable: false
          allOf:
            - $ref: '#/components/schemas/Amount'
      required:
        - period
        - pricing

    DomainAddon:
      type: object
      properties:
        dns_management:
          type: boolean
          example: true
          description: Whether DNS management is included
        email_forwarding:
          type: boolean
          example: true
          description: Whether email forwarding is included
        id_protection:
          type: boolean
          example: true
          description: Whether ID protection is included
        epp_code_required:
          type: boolean
          example: false
          description: Whether an EPP code is required for domain transfers
      required:
        - dns_management
        - email_forwarding
        - id_protection
        - epp_code_required

    DomainPricing:
      type: object
      properties:
        period:
          type: integer
        register:
          nullable: true
          allOf:
          - $ref: '#/components/schemas/Amount'
        transfer:
          nullable: true
          allOf:
           - $ref: '#/components/schemas/Amount'
        renew:
          nullable: true
          allOf:
           - $ref: '#/components/schemas/Amount'
      required:
        - register
        - transfer
        - renew
        - period

    TldPricing:
      type: object
      required:
        - tld
        - categories
        - group
        - pricing
      properties:
        tld:
          type: string
          example: com
        categories:
          type: array
          items:
            type: string
          example: ["Other"]
        group:
          type: string
          nullable: true
          example: "Sale"
        addons:
          $ref: '#/components/schemas/DomainAddon'
        pricing:
          type: array
          items:
            $ref: '#/components/schemas/DomainPricing'
        grace_period:
          $ref: '#/components/schemas/DomainGracePeriod'
        redemption_period:
          $ref: '#/components/schemas/DomainGracePeriod'

    DomainGracePeriod:
      type: object
      nullable: true
      required:
        - days
        - price
      properties:
        days:
          type: integer
          example: 1
        price:
          $ref: '#/components/schemas/Amount'

    DomainRenewal:
      allOf:
        - $ref: "#/components/schemas/Domain"
        - type: object
          properties:
            id:
              type: integer
              format: int64
              example: 123456
              description: the unique ID for the domain within the application
            status:
              enum: [Active, Expired, Grace, Redemption, Pending, Cancelled]
              description: the current status of the domain
            expiry_date:
              type: string
              format: date
              example: 2026-03-14
              description: the date the domain is due to expire
            days_to_expiry:
              type: integer
              format: int32
              example: 45
              description: the number of days until the domain expires
            days_of_grace_period:
                type: integer
                format: int32
                example: 30
                description: the number of days in the grace period after expiry
            in_grace_period:
              type: boolean
              description: whether the domain is currently within the grace period after expiry
            days_of_redemption_period:
                type: integer
                format: int32
                example: 30
                description: the number of days in the redemption period after expiry
            past_redemption_period:
              type: boolean
              description: whether the domain is currently within the redemption period after expiry
            days_left_in_period:
              type: integer
              format: int32
              example: 15
              description: the number of days left in the current grace or redemption period
            in_redemption_period:
              type: boolean
              description: whether the domain is currently within the redemption period after expiry
            is_premium:
              type: boolean
              description: whether the domain is a premium domain
            is_expiring_soon:
              type: boolean
              description: whether the domain is within the renewal period
            eligible_for_renewal:
              type: boolean
              description: whether the domain is eligible for renewal
            free_domain_renewal:
              type: boolean
              description: whether the domain renewal is free
            renewal_periods:
              type: array
              description: the available renewal periods for the domain
              items:
                $ref: '#/components/schemas/DomainRenewalPricing'
          required:
            - id
            - status
            - expiry_date
            - eligible_for_renewal
            - renewal_periods

    IdnLanguage:
      type: object
      required:
        - code
        - language
      properties:
        code:
          type: string
          example: eng
        language:
          type: string
          example: English

  parameters:
    search_query:
      name: query
      in: query
      description: Search query
      required: true
      schema:
        type: string
        minLength: 3
        maxLength: 128

    cart_item_id:
      name: item_id
      in: path
      description: Cart Item ID
      required: true
      schema:
        type: string
        minLength: 8
        maxLength: 8

    group_id:
      name: group_id
      in: path
      description: Product Group ID
      required: true
      schema:
        type: integer
        format: int64

    product_id:
      name: product_id
      in: path
      description: Product ID
      required: true
      schema:
        type: integer
        format: int64

    cart_id:
      name: cart_id
      in: path
      description: Cart ID
      required: true
      schema:
        type: string
        minLength: 16
        maxLength: 16

    service_id:
      name: service_id
      in: path
      description: Service ID
      required: true
      schema:
        type: integer
        format: int64
        example: 789

    invoice_id:
      name: invoice_id
      in: path
      description: Invoice ID
      required: true
      schema:
        type: integer
        format: int64
        example: 456

    paymethod_id:
      name: paymethod_id
      in: path
      description: |-
        A stored payment method ID from the `GET /user/paymethods` endpoint. This is the same value that the `POST /cart/{cart_id}/checkout` endpoint accepts as the `payment.paymethod_id` value.

        The minimum possible value is `1`.
      required: true
      schema:
        type: integer
        format: int64
        minimum: 1
        example: 12

    service_addon_id:
      name: service_addon_id
      in: path
      description: Service Addon ID
      required: true
      schema:
        type: integer
        format: int64
        example: 567

    service_customfield_id:
      name: service_customfield_id
      in: path
      description: Service Custom Field ID
      required: true
      schema:
        type: integer
        format: int64
        example: 234

    service_configoption_id:
      name: service_configoption_id
      in: path
      description: Service Configuration Option ID
      required: true
      schema:
        type: integer
        format: int64
        example: 89

    custom_field_id:
      name: custom_field_id
      in: path
      description: Custom Field ID
      required: true
      schema:
        type: integer
        format: int64
        example: 345

    config_option_id:
      name: config_option_id
      in: path
      description: Configuration Option ID
      required: true
      schema:
        type: integer
        format: int64
        example: 345

    client_id:
      name: client_id
      in: path
      description: Client ID
      required: true
      schema:
        type: integer
        format: int64

    user_id:
      name: user_id
      in: path
      description: User ID
      required: true
      schema:
        type: integer
        format: int64

    client_uuid:
      name: client_uuid
      in: path
      description: Client UUID
      required: true
      schema:
        type: string
        minLength: 36
        maxLength: 36
        example: 11C2M72y-z54n-5721-nnF8-13492be5uHiu

    domain:
      name: domain
      in: query
      description: Domain name
      required: true
      schema:
        type: string
        example: example.com

    domain_id:
      name: domain_id
      in: path
      description: Domain ID
      required: true
      schema:
        type: integer
        format: int64
        example: 789

    tld:
      name: tld
      in: query
      description: Top level domain
      required: true
      schema:
        type: string
        example: com

    tld_id:
      name: tld_id
      in: path
      description: Top level domain ID
      required: true
      schema:
        type: string
        example: com

    page:
      name: page
      in: query
      description: Page number
      required: false
      schema:
        type: integer
        minimum: 1
        example: 1

    page_size:
      name: page_size
      in: query
      description: >
        Number of items per page. The maximum allowed value is 500.
        The default value is 50.
      required: false
      schema:
        type: integer
        minimum: 1
        example: 10
        maximum: 500

    country_code:
      name: country_code
      in: path
      description: The ISO 3166-1 alpha-2 country code or the customized country code.
      required: true
      schema:
        type: string
        minLength: 2
        example: US

  responses:
    Unauthorized:
      description: Access Not Authorized
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/GeneralError'

    Forbidden:
      description: |-
        The caller is authenticated but does not have permission to use this resource (the _View & Pay Invoices_ permission).
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/GeneralError'

    NotFound:
      description: Entity Not Found
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/GeneralError'

    NotImplemented:
      description: Functionality Not Implemented
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/GeneralError'

    GeneralError:
      description: General Error
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/GeneralError'

    Conflict:
      description: |-
        The request conflicts with the current state of the resource (for example, cart-lock contention, or an item-mutating operation on a cart that has already checked out).
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/GeneralError'

  securitySchemes:
    XApiState:
      type: apiKey
      in: header
      name: X-Api-State
      description: |-
        The `/user/session` state token, which includes the authenticated client and user IDs.

        All `/user/*` endpoints and checkout request bodies that authenticate as a client require this token.
