  /user/invoices/{invoice_id}:
    get:
      description: |-
        Retrieve a specific invoice for the authenticated client.

        Poll this endpoint while a payment clears. Payment is complete only when the status is `Paid`. A `Payment Pending` invoice (an in-progress ACH or SEPA direct debit, for example) has not completed.

        To hand the shopper off to a WHMCS payment page, use the `POST /user/invoices/{invoice_id}/payment-link` endpoint.
      parameters:
        - $ref: "#/components/parameters/invoice_id"
      responses:
        200:
          description: |-
            Invoice information.
          content:
            application/json:
              schema:
                required:
                  - data
                properties:
                  data:
                    $ref: '#/components/schemas/Invoice'
        401:
          $ref: '#/components/responses/Unauthorized'
        403:
          $ref: '#/components/responses/Forbidden'
        404:
          $ref: '#/components/responses/NotFound'
        default:
          $ref: '#/components/responses/GeneralError'

  /user/invoices/{invoice_id}/payment-link:
    post:
      description: |-
        Issue a single-use link that hands the shopper off to a WHMCS payment page. Each call issues a new link.
      parameters:
        - $ref: "#/components/parameters/invoice_id"
      responses:
        200:
          description: |-
            The hand-off link. The `url` value is single-use and short-lived.
          content:
            application/json:
              schema:
                required:
                  - data
                properties:
                  data:
                    type: object
                    required:
                      - next_action
                    properties:
                      next_action:
                        $ref: '#/components/schemas/NextActionRedirect'
        401:
          $ref: '#/components/responses/Unauthorized'
        403:
          $ref: '#/components/responses/Forbidden'
        404:
          $ref: '#/components/responses/NotFound'
        422:
          description: |-
            The invoice is not awaiting payment. Only `Unpaid` and `Collections` status invoices can be handed off.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GeneralError'
        429:
          description: |-
            Too many payment link requests have occurred (more than 30 within five minutes).

            The system counts these requests per client IP address. Because of this, integrations that proxy shoppers server-side will reach this limit quickly.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GeneralError'
        default:
          $ref: '#/components/responses/GeneralError'

  /user/invoices/{invoice_id}/payment-session:
    post:
      description: |-
        Start a headless payment for an invoice that already exists, without sending the shopper to a WHMCS payment page. Instead, this renders and confirms the payment from within your integration. A payment method may still redirect the shopper to their bank and then back to a URL that you own (see **Redirect methods** below).

        **Behavior**
        - This endpoint returns the session as the `data.payment_session` value. The `POST /cart/{cart_id}/checkout` endpoint only returns the same `PaymentSession` object as the `data.payment.next_action.session` value when its `next_action.type` value is `payment_session`.
        - Issuing a session is not a payment. This endpoint does not place the order, change the invoice status, or record a transaction, so you can safely abandon and repeat the call.
        - Unlike checkout, this endpoint refuses a gateway that cannot handle headless payment with a `422` error instead of returning a redirect. To avoid this, check the `supports_headless_payment_session` value on the `GET /store/billing/gateways` endpoint in advance.

        **Choosing a Gateway**
        This endpoint uses the invoice's own `payment_method` value unless you provide a `gateway` value, which pays with that gateway instead and records it on the invoice.

        **Redirect Methods**
        With the `stripe_dynamic` gateway, an issued session offers the same redirect methods that WHMCS's own invoice payment pages offer, such as iDEAL or Bancontact, where the merchant enabled them. A session that the `POST /cart/{cart_id}/checkout` endpoint issues does not offer them, because the order form does not.

        - For sessions that include a redirect, give the SDK a return URL of your own when you confirm. The shopper returns to your own page, not to WHMCS.
        - Redirect methods update the invoice status asynchronously. As a result, expect the invoice to still be unpaid when they return.

        **Do Not Trust Input from the Return URL**
        Never mark an order paid, grant access, or provision a service because a `redirect_status` value is `succeeded`. Instead, confirm the invoice status with WHMCS directly.

        - For more information, see the `settlement` value's description on the `PaymentSession` schema.

        Whether webhook handling recovers a confirmation you never make depends on the gateway, so read the per-gateway behavior on the confirmation endpoint before relying on it. Where it does apply, treat it as a backstop rather than as your settlement path, because it reports no outcome to your integration.
      parameters:
        - $ref: "#/components/parameters/invoice_id"
      requestBody:
        required: false
        description: |-
          Optional. Omit the body entirely or send `{}` to pay with the gateway the invoice already lists. See the `InvoicePaymentSessionRequestBody` object for the property reference.

          This body is intentionally not declared as a validated schema, only as examples. The spec-validation library treats a zero-byte body as invalid JSON whenever a `requestBody` schema exists, regardless of whether the `required` value is `false`, and paying with the invoice's own gateway does not require a body.
        content:
          application/json:
            examples:
              invoiceOwnGateway:
                summary: "Empty body: pay with the gateway the invoice already lists."
                value: {}
              namedGateway:
                summary: Pay with another gateway and record it on the invoice.
                value:
                  gateway: stripe_dynamic
      responses:
        200:
          description: |-
            The session to render. Pass the `params` value to the SDK that the `provider` value lists, and then follow the `settlement` value.
          content:
            application/json:
              schema:
                required:
                  - data
                properties:
                  data:
                    type: object
                    required:
                      - payment_session
                    properties:
                      payment_session:
                        $ref: '#/components/schemas/PaymentSession'
        401:
          $ref: '#/components/responses/Unauthorized'
        403:
          $ref: '#/components/responses/Forbidden'
        404:
          $ref: '#/components/responses/NotFound'
        422:
          description: |-
            The system cannot issue a session for this invoice due to one of the following reasons:

            - The invoice is not awaiting payment. Only `Unpaid` and `Collections` status invoices are collectable. The `Payment Pending` status is excluded to avoid duplicating in-progress payments.
            - The gateway cannot start a headless session.
            - A named gateway cannot pay this invoice.
            - The system refused the gateway because the `gateway` value was not a string.
            - The body was not valid JSON.
            - There is no `gateway` value and the invoice does not include a `payment_method` value. Set a `gateway` value to issue the session.

            The system will not return a hand-off `url` value and no invoice changes will occur.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GeneralError'
        429:
          description: |-
            Too many payment session requests have occurred (more than 30 within five minutes). This error prevents unbounded callers from exceeding the merchant's API quota, which could block valid orders.

            The system counts these requests per client IP address. Because of this, integrations that proxy shoppers server-side will reach this limit quickly.

            The system will not return a hand-off `url` value and no invoice changes will occur.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GeneralError'
        default:
          $ref: '#/components/responses/GeneralError'

  /user/invoices/{invoice_id}/payment-session/confirm:
    post:
      description: |-
        Settle a headless payment the buyer has approved in your own integration. You **must** call this for any payment session where the `settlement` value is `sync_confirm`.

        Behavior varies for each payment gateway:
        - **PayPal** confirmation captures the approved order. If you skip it, the buyer's approval expires uncaptured, no payment occurs, and no webhook recovers it.
        - **Stripe** confirmation records payment that has already occurred. If you skip it, the `charge.succeeded` webhook settles the payment.

        The `payment.status` value has four outcomes:

        - `paid` — The gateway accepted the payment.
        - `pending` — The gateway took the payment but has not settled it (a PayPal `PENDING` capture, or a Stripe payment method still clearing, such as a bank debit or a redirect method) and the status is `Payment Pending`. Keep polling the `GET /user/invoices/{invoice_id}` endpoint.
        - `declined` — The gateway declined the payment method. Present another payment method.
        - `failed` — The attempt did not complete. Try again.

      parameters:
        - $ref: "#/components/parameters/invoice_id"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - provider_reference
              properties:
                provider_reference:
                  type: string
                  description: |-
                    The gateway's identifier for the approved payment:
                    - For PayPal, this is the `onApprove` order ID.
                    - For Stripe, this is the `params.paymentIntentId` value from the payment session.

                    WHMCS passes this identifier to the gateway without reading it.
                  example: pi_3Ph2M2HeadlessIntent
      responses:
        200:
          description: |-
            The gateway's outcome.

            A `200` status indicates that the system attempted confirmation and received a response, **not** that payment succeeded.
          content:
            application/json:
              schema:
                required:
                  - data
                properties:
                  data:
                    type: object
                    required:
                      - payment
                    properties:
                      payment:
                        type: object
                        required:
                          - status
                        properties:
                          status:
                            type: string
                            enum:
                              - paid
                              - pending
                              - declined
                              - failed
                            description: |-
                              - `paid` is the only accepted state.
                              - `pending` indicates that the payment is still in progress. Continue polling the invoice.
                              - `declined` indicates that the payment method was declined.
                              - `failed` indicates that the attempt did not complete.
                            example: paid
                          message:
                            type: string
                            description: |-
                              For `declined` and `failed` outcomes, the reason that the payment gateway reported for why payment was declined or failed.
                            example: INSTRUMENT_DECLINED
        401:
          $ref: '#/components/responses/Unauthorized'
        403:
          $ref: '#/components/responses/Forbidden'
        404:
          $ref: '#/components/responses/NotFound'
        409:
          description: |-
            Settlement for this invoice is in progress.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GeneralError'
        422:
          description: |-
            This status indicates that the `provider_reference` value is missing, the gateway does not settle using confirmation, or the gateway refused confirmation.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GeneralError'
        429:
          description: |-
            Too many confirmation requests have occurred (more than 30 within five minutes). This error prevents unbounded callers from exceeding the merchant's API quota, which could block valid requests.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GeneralError'
        default:
          $ref: '#/components/responses/GeneralError'

  /user/paymethods:
    get:
      description: |-
        Retrieve the authenticated client's stored payment methods.
      parameters:
        - $ref: "#/components/parameters/page"
        - $ref: "#/components/parameters/page_size"
      responses:
        200:
          description: |-
            The client's stored payment methods, if any exist, starting with the default payment method.
          content:
            application/json:
              schema:
                required:
                  - data
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/PayMethod'
        401:
          $ref: '#/components/responses/Unauthorized'
        403:
          $ref: '#/components/responses/Forbidden'
        default:
          $ref: '#/components/responses/GeneralError'

  /user/paymethods/{paymethod_id}:
    get:
      description: |-
        Retrieve one of the authenticated client's stored payment methods.
      parameters:
        - $ref: "#/components/parameters/paymethod_id"
      responses:
        200:
          description: The stored payment method.
          content:
            application/json:
              schema:
                required:
                  - data
                properties:
                  data:
                    $ref: '#/components/schemas/PayMethod'
        401:
          $ref: '#/components/responses/Unauthorized'
        403:
          $ref: '#/components/responses/Forbidden'
        404:
          $ref: '#/components/responses/NotFound'
        default:
          $ref: '#/components/responses/GeneralError'
    delete:
      description: |-
        Remove one of the authenticated client's stored payment methods.
      parameters:
        - $ref: "#/components/parameters/paymethod_id"
      responses:
        200:
          description: |-
            The system removed the stored payment method. The system attempts to revoke the stored credential with the payment provider first. When it cannot revoke it - for example, when the gateway is inactive or the payment provider does not support revocation - the system still removes the local record and logs the reason.
        401:
          $ref: '#/components/responses/Unauthorized'
        403:
          $ref: '#/components/responses/Forbidden'
        404:
          $ref: '#/components/responses/NotFound'
        409:
          description: |-
            The system did not remove the stored payment method. Either a deletion of this method is already in progress, or the request to revoke the stored credential with the payment provider failed.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GeneralError'
        422:
          description: |-
            The **Allow Client Pay Method Removal** setting in the **Security** tab at **Configuration > System Settings > General Settings** is disabled, so the system cannot remove the payment method.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GeneralError'
        429:
          description: |-
            Too many removal requests have occurred (more than 30 within five minutes). This error prevents unbounded callers from exceeding the merchant's API quota at the payment provider, which the system contacts to revoke each stored token.

            The system counts these requests per client IP address. Because of this, integrations that proxy shoppers server-side will reach this limit quickly.

            The system does not remove the payment method.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GeneralError'
        default:
          $ref: '#/components/responses/GeneralError'

  /admin/session:
    post:
      description: Begin an administrator session.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - username
                - password
              properties:
                username:
                  allOf:
                    - description: The administrator's username.
                    - $ref: '#/components/schemas/Username'
                password:
                  allOf:
                    - description: The administrator's password.
                    - $ref: '#/components/schemas/Password'

      responses:
        200:
          description: Success
          content:
            application/json:
              schema:
                required:
                  - data
                properties:
                  data:
                    $ref: '#/components/schemas/Administrator'
        401:
          $ref: '#/components/responses/Unauthorized'
        412:
          description: You must provide a second authentication factor to login.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SecondFactorChallenge'
        default:
          $ref: '#/components/responses/GeneralError'

    delete:
      description: Log out of the administrator's session.
      responses:
        200:
          description: Success
        default:
          $ref: '#/components/responses/GeneralError'

  /admin/session/verify:
    post:
      description: Submit an admin's two-factor challenge response.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              example: { "key": "928364" }
              required:
                - fields
              properties:
                fields:
                  type: object

      responses:
        200:
          description: Success
          content:
            application/json:
              schema:
                required:
                  - data
                properties:
                  data:
                    $ref: '#/components/schemas/Administrator'
        401:
          $ref: '#/components/responses/Unauthorized'
        412:
          description: You provided an invalid second factor.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GeneralError'
        default:
          $ref: '#/components/responses/GeneralError'

  /admin/system/status:
    get:
      description: Obtain system status.
      responses:
        200:
          description: System status information
        default:
          $ref: '#/components/responses/GeneralError'

  /admin/clients/search:
    get:
      description: Find clients matching a search query.
      parameters:
        - $ref: "#/components/parameters/search_query"
        - $ref: "#/components/parameters/page"
        - $ref: "#/components/parameters/page_size"
      responses:
