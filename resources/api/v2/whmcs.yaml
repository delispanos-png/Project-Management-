  /cart/{cart_id}/checkout:
    post:
      description: |-
        Begin the checkout process.

        The request body determines the behavior:

        - An empty or omitted body preserves the legacy `cart.php` redirect response (no changes).
        - A non-empty JSON body runs the gateway-agnostic checkout: it places the order, resolves or registers the client, screens for fraud, and dispatches to the payment strategy for the gateway.

        The payment strategies are:
        - Already paid.
        - Fraud hold.
        - Nothing payable, when the order created no invoice.
        - Stored-token capture.
        - Offline or pending.
        - A headless payment session, when the request sets the `payment.mode` value to `headless` and the gateway supports it.
        - A hand-off that requires the shopper to complete payment using the returned `next_action.url` value.
      parameters:
        - $ref: "#/components/parameters/cart_id"
      requestBody:
        required: false
        description: |-
          Omit the body entirely or send `{}` for the legacy redirect behavior. See the `CheckoutRequestBody` object for the full property reference.

          This body is intentionally not declared as a validated schema, only as examples. The empty-body legacy contract must keep working even when a caller sends a zero-byte body with a `Content-Type: application/json` header, and the spec-validation library treats a zero-byte body as invalid JSON whenever a requestBody `schema` exists for an operation, regardless of whether the `required` value is `false`.

          The `CheckoutRequestBody` object in the `components/schemas` section holds the canonical, reusable definition of these properties. Because the operation does not declare it as its `requestBody` value, it ignores an unknown property instead of rejecting it.
        content:
          application/json:
            examples:
              legacyEmptyBody:
                summary: "Empty body: legacy redirect, unchanged from 2.0.0"
                value: {}
              existingClientCheckout:
                summary: Checkout as the already-authenticated caller
                value:
                  paymentmethod: stripe_dynamic
              newCustomerCheckout:
                summary: Checkout while registering a new client
                value:
                  paymentmethod: paypal
                  customer:
                    firstname: Jane
                    lastname: Doe
                    email: jane.doe@example.com
                    password: S7r0ng!Passw0rd#2026
                    country: GB
      responses:
        200:
          description: |-
            Success. An empty request body returns the legacy redirect `url` value. A non-empty body returns the full `CheckoutResult` object when the checkout is finished and needs nothing further from you: either it resolved as immediately paid, or it created no invoice and so has nothing payable.
          content:
            application/json:
              schema:
                required:
                  - data
                properties:
                  data:
                    oneOf:
                      - type: object
                        required:
                          - url
                        properties:
                          url:
                            type: string
                            example: https://example.com/
                      - $ref: '#/components/schemas/CheckoutResult'
        202:
          description: |-
            Accepted. The checkout completed but it requires follow-up: a payment hand-off, a fraud hold, or an offline or pending gateway. A checkout with nothing to pay needs no follow-up and answers `200` instead.
          content:
            application/json:
              schema:
                required:
                  - data
                properties:
                  data:
                    $ref: '#/components/schemas/CheckoutResult'
        400:
          description: Cart validation failure
          content:
            application/json:
              schema:
                required:
                  - data
                properties:
                  data:
                    type: object
                    properties:
                      validation_errors:
                        type: array
                        items:
                          $ref: '#/components/schemas/CartItemValidationError'
        401:
          $ref: '#/components/responses/Unauthorized'
        404:
          $ref: '#/components/responses/NotFound'
        409:
          $ref: '#/components/responses/Conflict'
        422:
          description: |-
            Invalid checkout request.

            This status indicates one of the following scenarios:

            - An inactive or unknown `paymentmethod` value.
            - An invalid promotion code.
            - A structurally impossible client and payment combination (for example, a new customer referencing a stored payment method).
            - A `payment.mode` value of `headless`.
              - Before order creation, if the gateway can neither start a session nor capture a supplied `paymethod_id` value, the system does not create an order or an invoice.
              - After order creation, if no payment session can be offered — a supported gateway fails to start one, or a stored `paymethod_id` value is declined and no session can then be minted — the order and its invoice already exist, and the invoice remains payable through the `GET /user/invoices/{invoice_id}` endpoint.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GeneralError'
        default:
          $ref: '#/components/responses/GeneralError'

