openapi: 3.0.3
info:
  title: WHMCS API
  description: |-
    WHMCS API 2.1.0 adds end-to-end checkout using the API. The `POST /cart/{cart_id}/checkout` endpoint accepts a request body that places the order directly instead of redirecting to `cart.php`. It also supports a headless payment mode, which returns a gateway payment session, which your integration renders itself, instead of a redirect.

    Six endpoints support this flow:
    - `GET /user/invoices` and `GET /user/invoices/{invoice_id}` poll an authenticated client's invoices and issue a payment hand-off link.
    - `POST /user/invoices/{invoice_id}/payment-session` and `POST /user/invoices/{invoice_id}/payment-session/confirm` pay an invoice that already exists, such as a renewal, without a redirect.
    - `GET /user/paymethods` and `DELETE /user/paymethods/{paymethod_id}` let your integration offer a client a saved payment method or remove one.

    This API never handles card data.

  version: 2.1.0
servers:
  - url: '/api/v2'

paths:
  /status:
    get:
      description: Retrieve the API system status.
      responses:
        200:
          description: Success
          content:
            application/json:
              schema:
                required:
                  - data
                properties:
                  data:
                    type: object
                    required:
                      - server_time
                      - timezone
                      - currencies
                    properties:
                      server_time:
                        type: string
                        example: 2022-02-06T21:04:45+00:00
                        format: date-time
                      timezone:
                        type: string
                        example: UTC
                      currencies:
                        type: array
                        items:
                          $ref: "#/components/schemas/Currency"

        default:
          $ref: '#/components/responses/GeneralError'

  /keepalive:
    post:
      description: Refresh the session's state.
      responses:
        200:
          description: Success
        default:
          $ref: '#/components/responses/GeneralError'

  /countries:
    get:
      description: Retrieve all supported countries.
      parameters:
        - $ref: "#/components/parameters/page"
        - $ref: "#/components/parameters/page_size"
      responses:
        200:
          description: Success
          content:
            application/json:
              schema:
                required:
                  - data
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/Country'
        default:
          $ref: '#/components/responses/GeneralError'

  /countries/{country_code}:
    get:
      description: Retrieve all supported states for a specific country.
      parameters:
        - $ref: "#/components/parameters/country_code"
        - $ref: "#/components/parameters/page"
        - $ref: "#/components/parameters/page_size"
      responses:
        200:
          description: Success
          content:
            application/json:
              schema:
                required:
                  - data
                properties:
                  data:
                    $ref: '#/components/schemas/Country'
        default:
          $ref: '#/components/responses/GeneralError'

  /billing/currencies:
    get:
      description: Retrieve all supported currencies.
      parameters:
        - $ref: "#/components/parameters/page"
        - $ref: "#/components/parameters/page_size"
      responses:
        200:
          description: Success
          content:
            application/json:
              schema:
                required:
                  - data
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/Currency'

        default:
          $ref: '#/components/responses/GeneralError'

  /billing/cycles:
    get:
      description: List billing cycles.
      parameters:
        - $ref: "#/components/parameters/page"
        - $ref: "#/components/parameters/page_size"
      responses:
        200:
          description: Success
          content:
            application/json:
              schema:
                required:
                  - data
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/RecurringCycle'

        default:
          $ref: '#/components/responses/GeneralError'

  /store/billing/gateways:
    get:
      description: List payment methods.
      parameters:
        - $ref: "#/components/parameters/page"
        - $ref: "#/components/parameters/page_size"
      responses:
        200:
          description: Success
          content:
            application/json:
              schema:
                required:
                  - data
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/PaymentGateway'
        default:
          $ref: '#/components/responses/GeneralError'

  /store/domain/spotlight:
    get:
      description: Retrieve a domain availability for spotlight TLDs.
      parameters:
        - $ref: "#/components/parameters/domain"
        - $ref: "#/components/parameters/page"
        - $ref: "#/components/parameters/page_size"
      responses:
        200:
          description: Success
          content:
            application/json:
              schema:
                required:
                  - data
                properties:
                  meta:
                    $ref: '#/components/schemas/Meta'
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/DomainStatus'
        default:
          $ref: '#/components/responses/GeneralError'

  /store/domain/suggestions:
    get:
      description: List the domains suggestions options.
      responses:
        200:
          description: Success
          content:
            application/json:
              schema:
                required:
                  - data
                properties:
                  meta:
                    allOf:
                      - $ref: '#/components/schemas/Meta'
                      - example: []
                  data:
                    $ref: '#/components/schemas/LookupProviderSuggestionOption'
        default:
          $ref: '#/components/responses/GeneralError'
    post:
      description: Query a list of domain suggestions.
      parameters:
        - $ref: "#/components/parameters/page"
        - $ref: "#/components/parameters/page_size"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              anyOf:
                - $ref: '#/components/schemas/DomainSuggestionRequest'
      responses:
        200:
          description: Success
          content:
            application/json:
              schema:
                required:
                  - data
                properties:
                  meta:
                    $ref: '#/components/schemas/Meta'
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/DomainStatus'
        default:
          $ref: '#/components/responses/GeneralError'

  /store/domain/availability:
    get:
      description: Retrieve the registration eligibility for a domain.
      parameters:
        - $ref: "#/components/parameters/domain"
      responses:
        200:
          description: Success
          content:
            application/json:
              schema:
                required:
                  - data
                properties:
                  meta:
                    allOf:
                      - $ref: '#/components/schemas/Meta'
                      - example: []
                  data:
                    type: object
                    properties:
                      is_domain_available:
                        type: boolean
                        description: True if the requested domain is available for registration
                      is_tld_available:
                        type: boolean
                        description: False if the TLD is not configured in the domain settings
                      domain:
                        $ref: '#/components/schemas/DomainStatus'
        501:
          $ref: '#/components/responses/NotImplemented'
        default:
          $ref: '#/components/responses/GeneralError'

  /store/domain/pricing:
    get:
      description: Retrieve all TLD pricing.
      parameters:
        - $ref: "#/components/parameters/page"
        - $ref: "#/components/parameters/page_size"
      responses:
        200:
          description: Success
          content:
            application/json:
              schema:
                properties:
                  meta:
                    $ref: '#/components/schemas/Meta'
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/TldPricing'
        default:
          $ref: '#/components/responses/GeneralError'

  /store/domain/pricing/{tld_id}:
    get:
      description: Retrieve a single TLD's pricing.
      parameters:
        - $ref: "#/components/parameters/tld_id"
      responses:
        200:
          description: Success
          content:
            application/json:
              schema:
                properties:
                  meta:
                    allOf:
                      - $ref: '#/components/schemas/Meta'
                      - example: []
                  data:
                    $ref: '#/components/schemas/TldPricing'
        default:
          $ref: '#/components/responses/GeneralError'

  /store/domain/pricing/spotlight:
    get:
      description: Retrieve pricing for spotlight TLDs.
      parameters:
        - $ref: "#/components/parameters/page"
        - $ref: "#/components/parameters/page_size"
      responses:
        200:
          description: Success
          content:
            application/json:
              schema:
                properties:
                  meta:
                    $ref: '#/components/schemas/Meta'
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/TldPricing'
        default:
          $ref: '#/components/responses/GeneralError'

  /store/domain/idnlanguages:
    get:
      description: Retrieve supported IDN languages.
      parameters:
        - $ref: "#/components/parameters/page"
        - $ref: "#/components/parameters/page_size"
      responses:
        200:
          description: A list of all supported IDN languages.
          content:
            application/json:
              schema:
                required:
                  - data
                properties:
                  meta:
                    $ref: '#/components/schemas/Meta'
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/IdnLanguage'
        default:
          $ref: '#/components/responses/GeneralError'

  /store/domain/additionalfields:
    get:
      description: Retrieve all additional fields for a specific TLD.
      parameters:
        - $ref: "#/components/parameters/tld"
      responses:
        200:
          description: Retrieve all additional fields for a specific TLD.
          content:
            application/json:
              schema:
                required:
                  - data
                properties:
                  meta:
                    allOf:
                      - $ref: '#/components/schemas/Meta'
                      - example: []
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/AdditionalField'

        default:
          $ref: '#/components/responses/GeneralError'

  /store/products:
    get:
      description: Retrieve all products.
      parameters:
        - $ref: "#/components/parameters/page"
        - $ref: "#/components/parameters/page_size"
      responses:
        200:
          description: A list of all products.
          content:
            application/json:
              schema:
                required:
                  - data
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/ProductPricing'
        default:
          $ref: '#/components/responses/GeneralError'

  /store/products/{product_id}:
    get:
      description: Retrieve a product.
      parameters:
        - $ref: "#/components/parameters/product_id"
      responses:
        200:
          description: Properties of a product.
          content:
            application/json:
              schema:
                required:
                  - data
                properties:
                  data:
                    $ref: '#/components/schemas/ProductPricing'
        default:
          $ref: '#/components/responses/GeneralError'

  /store/products/groups:
    get:
      description: Retrieve all product groups.
      parameters:
        - $ref: "#/components/parameters/page"
        - $ref: "#/components/parameters/page_size"
      responses:
        200:
          description: A list of all product groups.
          content:
            application/json:
              schema:
                required:
                  - data
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/Group'

        default:
          $ref: '#/components/responses/GeneralError'

  /store/products/groups/{group_id}:
    get:
      description: Retrieve a specific product group's data.
      parameters:
        - $ref: "#/components/parameters/group_id"
        - $ref: "#/components/parameters/page"
        - $ref: "#/components/parameters/page_size"
      responses:
        200:
          description: A list of all product groups.
          content:
            application/json:
              schema:
                required:
                  - data
                properties:
                  data:
                    type: object
                    allOf:
                      - $ref: '#/components/schemas/ProductGroup'
                      - required:
                          - products

        404:
          $ref: '#/components/responses/NotFound'

        default:
          $ref: '#/components/responses/GeneralError'

  /store/products/{product_id}/addons:
    get:
      description: Retrieve addons for a specific product.
      parameters:
        - $ref: "#/components/parameters/product_id"
        - $ref: "#/components/parameters/page"
        - $ref: "#/components/parameters/page_size"
      responses:
        200:
          description: A list of all product addons.
          content:
            application/json:
              schema:
                required:
                  - data
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/AddonPricing'

        404:
          $ref: '#/components/responses/NotFound'

        default:
          $ref: '#/components/responses/GeneralError'

  /store/products/{product_id}/customfields:
    get:
      description: Retrieve custom fields for a specific product.
      parameters:
        - $ref: "#/components/parameters/product_id"
        - $ref: "#/components/parameters/page"
        - $ref: "#/components/parameters/page_size"
      responses:
        200:
          description: A list of all product custom fields.
          content:
            application/json:
              schema:
                required:
                  - data
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/CustomField'
        404:
          $ref: '#/components/responses/NotFound'

        default:
          $ref: '#/components/responses/GeneralError'

  /store/products/{product_id}/configoptions:
    get:
      description: Retrieve configurable options for a specific product.
      parameters:
        - $ref: "#/components/parameters/product_id"
        - $ref: "#/components/parameters/page"
        - $ref: "#/components/parameters/page_size"
      responses:
        200:
          description: A list of all product configurable options.
          content:
            application/json:
              schema:
                required:
                  - data
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/ConfigOption'
        404:
          $ref: '#/components/responses/NotFound'

        default:
          $ref: '#/components/responses/GeneralError'

  /store/products/{product_id}/cross-sells:
    get:
      description: Retrieve all cross-sell products.
      parameters:
        - $ref: "#/components/parameters/product_id"
        - $ref: "#/components/parameters/page"
        - $ref: "#/components/parameters/page_size"
      responses:
        200:
          description: A list of all cross-sell products.
          content:
            application/json:
              schema:
                required:
                  - data
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/ProductPricing'
        default:
          $ref: '#/components/responses/GeneralError'

  /store/bundles/groups/{group_id}:
    get:
      description: Retrieve a specific product group's bundle data.
      parameters:
        - $ref: "#/components/parameters/group_id"
        - $ref: "#/components/parameters/page"
        - $ref: "#/components/parameters/page_size"
      responses:
        200:
          description: A list of all group bundles.
          content:
            application/json:
              schema:
                required:
                  - data
                properties:
                  data:
                    type: object
                    allOf:
                      - $ref: '#/components/schemas/BundleGroup'
        404:
          $ref: '#/components/responses/NotFound'

        default:
          $ref: '#/components/responses/GeneralError'
  /cart:
    post:
      description: Create a new cart.
      responses:
        200:
          description: Newly-created cart data.
          content:
            application/json:
              schema:
                required:
                  - data
                properties:
                  data:
                    $ref: '#/components/schemas/Cart'
        default:
          $ref: '#/components/responses/GeneralError'

    get:
      description: List all carts associated with logged-in user.
      parameters:
        - $ref: "#/components/parameters/page"
        - $ref: "#/components/parameters/page_size"
      responses:
        200:
          description: All of the carts for the logged-in user.
          content:
            application/json:
              schema:
                required:
                  - data
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/Cart'

        default:
            $ref: '#/components/responses/GeneralError'

  /cart/{cart_id}:
    get:
      description: Get cart information.
      parameters:
        - $ref: "#/components/parameters/cart_id"
        - $ref: "#/components/parameters/page"
        - $ref: "#/components/parameters/page_size"
      responses:
        200:
          description: The cart data.
          content:
            application/json:
              schema:
                required:
                  - data
                properties:
                  data:
                    $ref: '#/components/schemas/CartContents'
        404:
          $ref: '#/components/responses/NotFound'

        default:
          $ref: '#/components/responses/GeneralError'

  /cart/{cart_id}/validate:
    post:
      description: Validate the content of a given cart.
      parameters:
        - $ref: "#/components/parameters/cart_id"
      responses:
        200:
          description: List of errors if any.
          content:
            application/json:
              schema:
                required:
                  - data
                properties:
                  data:
                    type: object
                    properties:
                      validation_errors:
                        type: array
                        items:
                          $ref: '#/components/schemas/CartItemValidationError'
        404:
          $ref: '#/components/responses/NotFound'

        default:
          $ref: '#/components/responses/GeneralError'

  /cart/{cart_id}/items/{item_id}:
    post:
      description: Update an item in the cart.
      parameters:
        - $ref: "#/components/parameters/cart_id"
        - $ref: "#/components/parameters/cart_item_id"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              anyOf:
                - $ref: '#/components/schemas/CartItemTypeDomain'
                - $ref: '#/components/schemas/CartItemTypeProductEdit'
      responses:
        200:
          description: Success
          content:
            application/json:
              schema:
                required:
                  - data
                properties:
                  data:
                    $ref: '#/components/schemas/CartContents'
        404:
          $ref: '#/components/responses/NotFound'
        422:
          description: Invalid Item Id.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GeneralError'
        default:
          $ref: '#/components/responses/GeneralError'
    delete:
      description: Delete an item from the cart.
      parameters:
        - $ref: "#/components/parameters/cart_id"
        - $ref: "#/components/parameters/cart_item_id"
      responses:
        200:
          description: Success
          content:
            application/json:
              schema:
                required:
                  - data
                properties:
                  data:
                    $ref: '#/components/schemas/CartContents'
        404:
          $ref: '#/components/responses/NotFound'
        default:
          $ref: '#/components/responses/GeneralError'

  /cart/{cart_id}/items/{item_id}/addon:
    post:
      description: Associate product addons to an existing cart item.
      parameters:
        - $ref: "#/components/parameters/cart_id"
        - $ref: "#/components/parameters/cart_item_id"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              properties:
                addons:
                  type: array
                  items:
                    $ref: '#/components/schemas/CartItemTypeProductAddonRequest'
      responses:
        200:
          description: Success
          content:
            application/json:
              schema:
                required:
                  - data
                properties:
                  data:
                    $ref: '#/components/schemas/CartContents'
        404:
          $ref: '#/components/responses/NotFound'
        422:
          description: Invalid Product Id.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GeneralError'
        default:
          $ref: '#/components/responses/GeneralError'

  /cart/{cart_id}/items:
    post:
      description: Add one or more items to the cart.
      parameters:
        - $ref: "#/components/parameters/cart_id"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              properties:
                items:
                  type: array
                  items:
                    anyOf:
                      - $ref: '#/components/schemas/CartItemTypeProductRequest'
                      - $ref: '#/components/schemas/CartItemTypeServiceAddonRequest'
                      - $ref: '#/components/schemas/CartItemTypeBundleRequest'
                      - $ref: '#/components/schemas/CartItemTypeDomainRegisterRequest'
                      - $ref: '#/components/schemas/CartItemTypeDomainTransferRequest'
                      - $ref: '#/components/schemas/CartItemTypeDomainRenewalRequest'
                      - $ref: '#/components/schemas/CartItemTypeServiceRenewalRequest'
      responses:
        200:
          description: Success
          content:
            application/json:
              schema:
                required:
                  - data
                properties:
                  data:
                    $ref: '#/components/schemas/CartContents'
        404:
          $ref: '#/components/responses/NotFound'
        default:
          $ref: '#/components/responses/GeneralError'

    delete:
      description: Remove all items from cart.
      parameters:
        - $ref: "#/components/parameters/cart_id"
      responses:
        200:
          description: Success
          content:
            application/json:
              schema:
                required:
                  - data
                properties:
                  data:
                    $ref: '#/components/schemas/CartContents'
        404:
          $ref: '#/components/responses/NotFound'
        default:
          $ref: '#/components/responses/GeneralError'

  /cart/{cart_id}/items/{item_id}/addons:
    delete:
      description: Delete all addons from a product item in the cart.
      parameters:
        - $ref: "#/components/parameters/cart_id"
        - $ref: "#/components/parameters/cart_item_id"
      responses:
        200:
          description: Success
          content:
            application/json:
              schema:
                required:
                  - data
                properties:
                  data:
                    $ref: '#/components/schemas/CartContents'
        404:
          $ref: '#/components/responses/NotFound'
        422:
          description: Invalid Product ID.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GeneralError'
        default:
          $ref: '#/components/responses/GeneralError'

  /cart/{cart_id}/items/{item_id}/customfields:
    delete:
      description: Delete all custom fields from a product item in the cart.
      parameters:
        - $ref: "#/components/parameters/cart_id"
        - $ref: "#/components/parameters/cart_item_id"
      responses:
        200:
          description: Success
          content:
            application/json:
              schema:
                required:
                  - data
                properties:
                  data:
                    $ref: '#/components/schemas/CartContents'
        404:
          $ref: '#/components/responses/NotFound'
        422:
          description: Invalid Product ID.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GeneralError'
        default:
          $ref: '#/components/responses/GeneralError'
    post:
      description: Associate product custom fields to an existing cart item.
      parameters:
        - $ref: "#/components/parameters/cart_id"
        - $ref: "#/components/parameters/cart_item_id"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              properties:
                custom_fields:
                  type: array
                  items:
                    $ref: '#/components/schemas/CartItemTypeProductCustomFieldRequest'
      responses:
        200:
          description: Success
          content:
            application/json:
              schema:
                required:
                  - data
                properties:
                  data:
                    $ref: '#/components/schemas/CartContents'
        404:
          $ref: '#/components/responses/NotFound'
        422:
          description: Invalid Product ID.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GeneralError'
        default:
          $ref: '#/components/responses/GeneralError'

  /cart/{cart_id}/items/{item_id}/domain:
    post:
      description: Associate domain name to an existing cart item.
      parameters:
        - $ref: "#/components/parameters/cart_id"
        - $ref: "#/components/parameters/cart_item_id"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Domain'
      responses:
        200:
          description: Success
          content:
            application/json:
              schema:
                required:
                  - data
                properties:
                  data:
                    $ref: '#/components/schemas/CartContents'
        404:
          $ref: '#/components/responses/NotFound'
        422:
          description: Invalid Product ID.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GeneralError'
        default:
          $ref: '#/components/responses/GeneralError'

  /cart/{cart_id}/items/{item_id}/customfields/{custom_field_id}:
    get:
      description: Retrieve a specific custom field from an existing cart item.
      parameters:
        - $ref: "#/components/parameters/cart_id"
        - $ref: "#/components/parameters/cart_item_id"
        - $ref: "#/components/parameters/custom_field_id"
      responses:
        200:
          description: Success
          content:
            application/json:
              schema:
                required:
                  - data
                properties:
                  data:
