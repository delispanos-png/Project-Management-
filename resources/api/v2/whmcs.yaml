          format: int32
          example: 1
          minimum: 1
          maximum: 10
        idn_language:
          type: string
          description: certain IDN domains require a language code to be specified
          nullable: true
          example: afr
        dns_management:
          type: boolean
          example: true
        email_forwarding:
          type: boolean
          example: true
        id_protection:
          type: boolean
          example: true
        nameservers:
          type: array
          items:
            type: string
            example: ns1.example.com
          nullable: true
          description: list of nameservers to use instead of defaults
      required:
        - type
        - period

    CartItemTypeServiceRenewalRequest:
        type: object
        properties:
          type:
            type: string
            enum: [ service_renewal, addon_renewal, domain_renewal ]
            example: service_renewal
          id:
            type: integer
            format: int64
            example: 123
            description: the ID of the service, service addon, or domain to renew
        required:
          - id
          - type

    CartItemTypeDomainRenewalRequest:
      allOf:
        - $ref: '#/components/schemas/CartItemTypeServiceRenewalRequest'
        - type: object
          properties:
            type:
              type: string
              enum: [ domain_renewal ]
              example: domain_renewal
            period:
              type: integer
              description: the number of years to renew the domain for
              format: int32
              example: 1
              minimum: 1
              maximum: 9
      required:
        - period


    CartItemTypeDomainRequest:
      allOf:
        - $ref: '#/components/schemas/CartItemTypeDomain'
        - type: object
          properties:
            name:
              type: string
              description: a valid domain name to register
              example: thisisarandomwhmcsdomainname.com
              minLength: 3
              maxLength: 255
      required:
        - name

    CartItemTypeDomainRegisterRequest:
      allOf:
        - $ref: '#/components/schemas/CartItemTypeDomainRequest'
        - type: object
          properties:
            additional_fields:
              type: array
              description: certain TLDs require additional fields to be specified
              nullable: true
              items:
                type: string
                example: C1

    CartItemTypeDomainTransferRequest:
      allOf:
        - $ref: '#/components/schemas/CartItemTypeDomainRegisterRequest'
        - type: object
          properties:
            type:
              type: string
              enum: [ domain_transfer ]
              example: domain_transfer
            period:
              type: integer
              description: the number of years to extend the domain registration
              format: int32
              example: 1
              minimum: 1
              maximum: 9
            epp_code:
              type: string
              description: the EPP code for transferring the domain
              minLength: 1
              maxLength: 255
              example: 12345abcde
        - required:
            - epp_code

    CartItemTypeDomainRegister:
      allOf:
        - $ref: '#/components/schemas/CartItemTypeDomainRequest'
        - type: object
          properties:
            item_id:
              $ref: "#/components/schemas/CartItemId"
            additional_fields:
              type: array
              items:
                $ref: '#/components/schemas/AdditionalField'
            billing:
              $ref: '#/components/schemas/CartItemBilling'
      required:
        - item_id
        - billing

    CartItemTypeDomainTransfer:
      allOf:
        - $ref: '#/components/schemas/CartItemTypeDomainRegister'
        - $ref: '#/components/schemas/CartItemTypeDomainTransferRequest'
      required:
        - item_id

    CartItemTypeDomainRenewal:
      allOf:
        - $ref: '#/components/schemas/CartItemTypeDomainRenewalRequest'
      type: object
      properties:
        item_id:
          $ref: "#/components/schemas/CartItemId"
        name:
          type: string
          description: a valid domain name to renew
          example: example.com
          minLength: 3
        billing:
          $ref: '#/components/schemas/CartItemBilling'
      required:
        - item_id
        - name
        - billing

    CartItemTypeServiceRenewal:
      allOf:
        - $ref: '#/components/schemas/CartItemTypeServiceRenewalRequest'
      type: object
      properties:
        item_id:
          $ref: "#/components/schemas/CartItemId"
        name:
          type: string
          description: Name of the service
          example: cPanel Hosting
        domain:
          type: string
          description: service domain if applicable
          example: example.com
          nullable: true
        next_due_date:
          type: string
          format: date
          description: service next due date if applicable
          example: 2024-12-31
          nullable: true
        status:
          type: string
          description: service status
        billing:
          $ref: '#/components/schemas/CartItemBilling'
      required:
        - item_id
        - name
        - billing


    CartItemTypeProductAddon:
      type: object
      properties:
        item_id:
          $ref: "#/components/schemas/CartItemId"
        quantity:
          type: integer
          format: int32
          example: 5
        addon:
          $ref: "#/components/schemas/Addon"
        billing:
          $ref: '#/components/schemas/CartItemBilling'
      required:
        - item_id
        - quantity
        - addon
        - billing

    CartItemTypeServiceAddonRequest:
      type: object
      properties:
        type:
          type: string
          enum: [addon]
          example: addon
        data:
          $ref: '#/components/schemas/Addon'
        service_id:
          type: integer
          format: int64
          example: 123
        billing_cycle:
          $ref: '#/components/schemas/BillingCycle'
        quantity:
          type: integer
          format: int32
          nullable: true
      required:
        - type

    CartItemTypeServiceAddon:
      allOf:
        - $ref: '#/components/schemas/CartItemTypeProductAddon'
        - type: object
          properties:
            service_id:
              type: integer
              format: int64
              example: 123
            billing_cycle:
              $ref: '#/components/schemas/BillingCycle'

    CartItemTypeProductConfigOption:
      type: object
      properties:
        id:
          type: integer
          format: int64
          example: 123
        name:
          type: string
          example: Number of mailing lists
        type:
          $ref: "#/components/schemas/ConfigOptionType"
        option:
          type: object
          properties:
            name:
              type: string
              minLength: 1
              example: Config Option Name
            value:
              $ref: '#/components/schemas/ConfigOptionValueType'
        billing:
          $ref: '#/components/schemas/CartItemBilling'
      required:
        - id
        - type
        - billing

    ProductGroup:
      allOf:
        - $ref: "#/components/schemas/Group"
        - type: object
          properties:
            products:
              type: array
              items:
                $ref: '#/components/schemas/ProductPricing'

    BundleGroup:
      allOf:
        - $ref: "#/components/schemas/Group"
        - type: object
          properties:
            bundles:
              type: array
              items:
                $ref: '#/components/schemas/BundlePricing'

    Group:
      allOf:
        - $ref: "#/components/schemas/Entity"
        - type: object
          properties:
            icon:
              type: string
              nullable: true
              example: fa-solid
            headline:
              type: string
              nullable: true
              example: Headline
            tagline:
              type: string
              nullable: true
              example: Tagline
            order:
              type: integer
              format: int32
              example: 123
              description: The display order of the group as configured in the application.
            features:
              type: array
              items:
                $ref: '#/components/schemas/Feature'

    BundleItemProduct:
      allOf:
        - $ref: "#/components/schemas/Entity"
        - type: object
          properties:
            bundle_type:
              type: string
              enum:
                - product
              nullable: false
            billing_cycle:
              $ref: '#/components/schemas/BillingCycle'
            price_override:
              type: boolean
            price:
              $ref: '#/components/schemas/Amount'
            config_option:
              type: array
              nullable: true
              items:
                type: object
                properties:
                  id:
                    description: Configurable Option ID
                  value:
                    description: Required configurable option value
                    $ref: '#/components/schemas/ConfigOptionValueType'
            addons:
              type: array
              nullable: true
              items:
                type: integer
                description: Addon ID
            tlds:
              type: array
              nullable: true
              items:
                type: string
                example: '.com'
            domain_registration_period:
              type: integer
              minimum: 0
              maximum: 10
            domain_price_override:
              type: boolean
            domain_price:
              $ref: '#/components/schemas/Amount'
            domain_addons:
              type: array
              nullable: true
              items:
                type: string
                enum:
                  - dnsmanagement
                  - emailforwarding
                  - idprotection

    BundleItemDomain:
      allOf:
        - $ref: "#/components/schemas/Entity"
        - type: object
          properties:
            bundle_type:
              type: string
              enum: [domain]
              nullable: false
            tlds:
              type: array
              nullable: true
              items:
                type: string
                example: '.com'
            registration_period:
              type: integer
              minimum: 0
              maximum: 10
            price_override:
              type: boolean
            price:
              $ref: '#/components/schemas/Amount'
            addons:
              type: array
              nullable: true
              items:
                type: string
                enum:
                  - dnsmanagement
                  - emailforwarding
                  - idprotection

    Feature:
      allOf:
        - $ref: "#/components/schemas/Entity"
        - type: object
          required:
            - id
            - name
            - order
          properties:
            order:
              type: integer
              format: int64
              example: 123

    ServerGroup:
      allOf:
        - $ref: "#/components/schemas/Entity"

    Server:
      allOf:
        - $ref: "#/components/schemas/Entity"
        - type: object
          properties:
            groups:
              type: array
              items:
                $ref: "#/components/schemas/ServerGroup"

    Entity:
      type: object
      required:
        - id
      properties:
        id:
          type: integer
          format: int64
          example: 123
        name:
          nullable: true
          type: string
          minLength: 1
          example: Shared web hosting
        description:
          nullable: true
          type: string

    Product:
      allOf:
        - $ref: "#/components/schemas/Entity"
        - type: object
          properties:
            tagline:
              type: string
              nullable: true
              example: Start with shared web hosting today!
            allow_multiple_quantities:
              $ref: '#/components/schemas/ProductMultipleQuantities'
            is_domain_required:
              type: boolean
              description: Whether a domain is required to order this product
            stock_control_enabled:
              type: boolean
              description: Whether stock control is enabled for this product
            stock_quantity:
              type: integer
              description: The current stock quantity if stock control is enabled
              format: int32
              nullable: true
            order:
              type: integer
              format: int32
              example: 123
              description: The display order of the product as configured in the application.
            group:
              $ref: '#/components/schemas/Group'

    ProductType:
      type: object
      properties:
        name:
          type: string
          enum:
            - hostingaccount
            - reselleraccount
            - server
            - other
          example: hostingaccount
        display_name:
          type: string
          example: Hosting Account

    Bundle:
      allOf:
        - $ref: "#/components/schemas/Entity"
        - type: object
          properties:
            price:
              $ref: '#/components/schemas/Amount'
            max_uses:
              type: integer
            uses:
              type: integer
            allow_promo:
              type: boolean
            is_featured:
              type: boolean
            bundle_items:
              anyOf:
                - $ref: '#/components/schemas/BundleItemDomain'
                - $ref: '#/components/schemas/BundleItemProduct'
            group:
              $ref: '#/components/schemas/Group'

    ProductPricing:
      allOf:
        - $ref: "#/components/schemas/Product"
        - type: object
          required:
            - pricing
          properties:
            type:
              $ref: '#/components/schemas/ProductType'
            pricing:
              $ref: '#/components/schemas/Pricing'

    BundlePricing:
      allOf:
        - $ref: "#/components/schemas/Bundle"
        - type: object
          required:
            - price
          properties:
            price:
              $ref: '#/components/schemas/Amount'

    Addon:
      allOf:
        - $ref: "#/components/schemas/Entity"

    AddonPricing:
      allOf:
        - $ref: "#/components/schemas/Addon"
        - type: object
          required:
            - pricing
          properties:
            type:
              $ref: '#/components/schemas/ProductType'
            pricing:
              $ref: '#/components/schemas/Pricing'

    ProductMultipleQuantities:
      type: object
      properties:
        is_supported:
          type: boolean
          example: false
          description: Indicates whether the product supports multiple quantities.
        type:
          type: object
          properties:
            code:
              type: integer
              format: int32
              example: 1
              description: The internal code representing the multiple quantities setting.
            display:
              type: string
              example: No
              description: The human-readable display value for the multiple quantities setting.

    Pricing:
      type: object
      required:
        - is_free
      properties:
        is_free:
          type: boolean
        onetime:
          $ref: '#/components/schemas/OneTimePrice'
        recurring:
          type: array
          items:
            $ref: '#/components/schemas/CycleRecurringPrice'

    LineItemPrice:
      type: object
      properties:
        onetime:
          $ref: '#/components/schemas/OneTimePrice'
        recurring:
          $ref: '#/components/schemas/RecurringPrice'

    CartItemBilling:
      type: object
      nullable: true
      properties:
        cycle:
          $ref: '#/components/schemas/BillingCycle'
        price:
          nullable: true
          allOf:
            - $ref: '#/components/schemas/LineItemPrice'

    ServicePrice:
      type: object
      properties:
        first_payment:
          $ref: '#/components/schemas/ServiceFirstPaymentPrice'
        recurring:
          $ref: '#/components/schemas/ServiceRecurringPrice'

    Amount:
      type: object
      properties:
        value:
          type: string
          example: "19.99"
        code:
          $ref: "#/components/schemas/CurrencyCode"
        display_value:
          type: string
          example: "$19.99 USD"
        prefix:
          type: string
          description: Optional currency prefix
          example: "$"
        suffix:
          type: string
          description: Optional currency prefix
          example: " USD"
      required:
        - value
        - code
        - display_value
        - prefix
        - suffix

    Currency:
      type: object
      properties:
        code:
          $ref: "#/components/schemas/CurrencyCode"
        prefix:
          type: string
          description: Optional currency prefix
          example: "$"
        suffix:
          type: string
          description: Optional currency prefix
          example: USD
        default:
          type: boolean
          description: This is true if the currency is currently the system default.

    Country:
      type: object
      required:
        - code
        - name
      properties:
        code:
          type: string
          minLength: 2
          description: The ISO 3166-1 alpha-2 country code or the customized country code.
          example: US
        name:
          type: string
          example: United States
        states:
          type: array
          nullable: true
          items:
            $ref: '#/components/schemas/State'

    State:
      type: object
      required:
        - code
        - name
      properties:
        code:
          type: string
          minLength: 1
          maxLength: 10
          example: CA
        name:
          type: string
          example: California

    CurrencyCode:
      type: string
      pattern: "^[A-Z]{3}$"
      example: USD

    Email:
      type: string
      minLength: 6
      maxLength: 255
      example: me@example.com

    Username:
      type: string
      minLength: 3
      maxLength: 255
      example: administrator

    Password:
      type: string
      minLength: 4
      maxLength: 64
      example: NeedNewPassword!!!

    Name:
      type: string
      minLength: 2
      maxLength: 64
      example: Davis

    Administrator:
      type: object
      description: Logged-in administrator data.
      required:
        - email
        - firstname
        - lastname
      properties:
        email:
          $ref: '#/components/schemas/Email'
        firstname:
          $ref: '#/components/schemas/Name'
        lastname:
          $ref: '#/components/schemas/Name'

    User:
      type: object
      description: Logged-in user data.
      required:
        - email
        - firstname
        - lastname
        - clients
      properties:
        email:
          $ref: '#/components/schemas/Email'
        firstname:
          $ref: '#/components/schemas/Name'
        lastname:
          $ref: '#/components/schemas/Name'
        clients:
          type: array
          items:
            $ref: '#/components/schemas/Client'

    Client:
      type: object
      required:
        - uuid
      properties:
        uuid:
          type: string
          minLength: 36
          maxLength: 36
          example: 11C2M72y-z54n-5721-nnF8-13492be5uHiu
        company:
          type: string
          maxLength: 64
        selected:
          type: boolean

    AdminClient:
      allOf:
        - $ref: '#/components/schemas/Client'
        - type: object
          properties:
            id:
              type: integer
              format: int64
              example: 123

    AdminUser:
      allOf:
        - $ref: '#/components/schemas/User'
        - type: object
          properties:
            id:
              type: integer
              format: int64
              example: 123

    OneTimePrice:
      type: object
      required:
        - setup
        - amount
      properties:
        setup:
          $ref: '#/components/schemas/Amount'
        amount:
          $ref: '#/components/schemas/Amount'

    ServiceFirstPaymentPrice:
      type: object
      required:
        - amount
      properties:
        amount:
          $ref: '#/components/schemas/Amount'

    ServiceRecurringPrice:
      type: object
      required:
        - amount
      properties:
        amount:
          $ref: '#/components/schemas/Amount'

    RecurringPrice:
      allOf:
        - type: object
          properties:
            setup:
              $ref: '#/components/schemas/Amount'
          required:
            - setup
        - $ref: "#/components/schemas/ServiceRecurringPrice"

    CycleRecurringPrice:
      allOf:
        - type: object
          properties:
            cycle:
              $ref: '#/components/schemas/BillingCycle'
          required:
            - cycle
        - $ref: "#/components/schemas/RecurringPrice"

    RecurringCycle:
      type: object
      required:
        - cycle
      properties:
        cycle:
          $ref: '#/components/schemas/BillingCycle'
        description:
          type: string
          example: Monthly
        months:
          type: integer
          format: int32
          description: The number of months for this cycle.
          example: 1

    BillingCycle:
      type: string
      nullable: true
      description: Billing cycle's frequency.
      example: monthly
      enum:
        - free
        - onetime
        - monthly
        - quarterly
        - semiannually
        - annually
        - biennially
        - triennially

    CartTotal:
      type: object
      properties:
        recurring:
          type: array
          items:
            type: object
            required:
              - cycle
              - amount
            properties:
              cycle:
                $ref: '#/components/schemas/BillingCycle'
              amount:
                $ref: '#/components/schemas/Amount'
        subtotal:
          $ref: '#/components/schemas/Amount'
        discounts:
          type: array
          items:
            $ref: '#/components/schemas/Discount'
        geolocation:
          $ref: '#/components/schemas/GeoLocation'
        taxes:
          type: array
          items:
            $ref: '#/components/schemas/Tax'
        total:
          $ref: '#/components/schemas/Amount'

    CartContents:
      required:
        - items
        - upgrades
        - promotions
        - totals
      properties:
        items:
          type: array
          items:
            anyOf:
              - $ref: '#/components/schemas/CartItemTypeProduct'
              - $ref: '#/components/schemas/CartItemTypeServiceAddon'
              - $ref: '#/components/schemas/CartItemTypeDomainRegister'
              - $ref: '#/components/schemas/CartItemTypeDomainTransfer'
              - $ref: '#/components/schemas/CartItemTypeDomainRenewal'
              - $ref: '#/components/schemas/CartItemTypeServiceRenewal'
              - $ref: '#/components/schemas/CartItemTypeBundle'
        upgrades:
          type: array
          description: Pending service or addon upgrades in the cart
          items:
            $ref: '#/components/schemas/CartUpgrade'
        promotions:
          type: array
          items:
            $ref: '#/components/schemas/Promotion'
        totals:
          $ref: '#/components/schemas/CartTotal'

    CartUpgrade:
      type: object
      description: A pending service or addon upgrade in the cart
      required:
        - index
        - type
        - newRecurringAmount
        - upgradeAmount
        - creditAmount
        - newCycle
        - daysRemaining
        - totalDaysInCycle
      properties:
        index:
          type: integer
          description: Zero-based position of this upgrade in the cart
          example: 0
        type:
          type: string
          enum: [service, addon]
          description: Whether this is a service (product) or addon upgrade
        originalProductName:
          type: string
          description: Current product name (service upgrades only)
          example: "Starter Hosting"
        newProductName:
          type: string
          description: Target product name (service upgrades only)
          example: "Pro Hosting"
        groupName:
          type: string
          description: Product group name (service upgrades only)
          example: "Shared Hosting"
        domain:
          type: string
          description: Service domain (service upgrades only)
          example: "example.com"
        originalAddonName:
          type: string
          description: Current addon name (addon upgrades only)
          example: "Basic SSL"
        newAddonName:
          type: string
          description: Target addon name (addon upgrades only)
          example: "Wildcard SSL"
        newRecurringAmount:
          $ref: '#/components/schemas/Amount'
        upgradeAmount:
          $ref: '#/components/schemas/Amount'
        creditAmount:
          $ref: '#/components/schemas/Amount'
        newCycle:
          type: string
          description: Localised billing cycle label for the new plan
          example: "Monthly"
        daysRemaining:
          type: integer
          description: Days left in the current billing cycle
          example: 18
        totalDaysInCycle:
          type: integer
          description: Total days in the current billing cycle
          example: 30

    CartItemValidationError:
      type: object
      properties:
        item_id:
          type: string
        errors:
          type: array
          items:
            anyOf:
              - type: string
              - type: object
                properties:
                  id:
                    type: integer
                    format: int64
                  type:
                    type: string
                    enum: [product, addon, service, customfield, configoption, bundle]
                  error:
                    type: string

    GeoLocation:
      type: object
      properties:
        country_code:
          type: string
          minLength: 2
          example: US
          description: The ISO 3166-1 alpha-2 country code or the customized country code.
        state:
          type: string
          maxLength: 64
          example: California
          description: State, province, or region code if applicable
          nullable: true
      required:
          - country_code

    Tax:
      type: object
      required:
        - name
        - percentage
        - amount
      properties:
        name:
          type: string
        percentage:
          type: number
          format: float
          multipleOf: 0.001
          example: 7.5
        amount:
          $ref: '#/components/schemas/Amount'

    Discount:
      type: object
      required:
        - type
        - amount
      properties:
        type:
          type: string
          enum: [promotions, client]
        amount:
          $ref: '#/components/schemas/Amount'

    Cart:
      type: object
      required:
        - id
      properties:
        id:
          type: string
          minLength: 16
          maxLength: 16
          example: V8UH6nyaU6Hj8hCh

    Promotion:
      type: object
      nullable: true
      required:
        - code
      properties:
        code:
          type: string
          nullable: true
          example: PROMOCODE
        type:
          type: string
          example: Fixed Amount
          nullable: true
        value:
          type: number
          format: float
          example: 5.0
          description: Monetary amount or discount percentage
          nullable: true
        is_recurring:
          type: boolean
          nullable: true
        number_of_recurring:
          type: integer
          nullable: true
          example: 5
          description: maximum number of times the promotion code will be applied if set

    TwoFaField:
      type: object
      required:
        - name
        - type
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 64
        description:
          type: string
          maxLength: 64
        type:
          enum:
            - number
            - text

    SecondFactorChallenge:
      description: Second factor challenge information.
      properties:
        condition:
          enum:
            - twofa
        fields:
          type: array
          items:
            $ref: '#/components/schemas/TwoFaField'

    PayMethod:
      type: object
      # Closed on purpose, and the only schema here that is. This object is assembled
      # from a stored payment method, whose record also holds the token that can charge
      # it, the card number and the bank account number. The formatter publishes an
      # allow-list, but without this line the spec would accept anything it ever emitted
      # by accident - so a future field carrying a credential would ship silently, past a
      # response validator and past the test whose stated purpose is to catch exactly
      # that.
      #
      # Know what this costs before adding a field: ApiNgSpecValidator validates every
      # response in production too, not only where display_errors is on, so an
      # undeclared field is a client-facing 500 - not a warning, and not dev-only. That
      # is the intended trade (a 500 beats shipping a credential), but it means adding a
      # field to PayMethodService::format() without declaring it here breaks the
      # endpoint for real clients.
      additionalProperties: false
      description: |-
        A payment method the client stored, as the system displays it to that client.

        A `null` value indicates that a property applies to that payment method but does not have a value.
      required:
        - id
        - type
        - kind
        - description
        - gateway
        - gateway_is_active
        - is_default
      properties:
        id:
          type: integer
          format: int64
          description: |-
            Pass this value as the `payment.paymethod_id` value when checking out a cart to pay with this stored method.
          example: 12
        type:
          type: string
          description: |-
            How WHMCS stores the method internally.
          example: RemoteCreditCard
        kind:
          type: string
          nullable: true
          enum:
            - card
            - wallet
            - bank_account
          description: |-
            The type of payment method.

            A `null` value indicates that the system could not find the payment method's stored details.
          example: card
        description:
          type: string
          description: |-
            The client's label for this method, if they set one.
          example: Weekend Card
        gateway:
          type: string
          description: |-
            The payment gateway module for this payment method.
          example: stripe_dynamic
        gateway_is_active:
          type: boolean
          description: |-
            Whether the payment gateway is currently active on this installation.

            If the payment gateway is not currently active, the client cannot pay using this method.
          example: true
        is_default:
          type: boolean
          description: >-
            Whether this is the client's default payment method. Exactly one of a client's
            methods is the default.
          example: true
        label:
          type: string
          description: |-
            A short human-readable display name for the payment method.
          example: Visa-4242
        card_type:
          type: string
          description: |-
            The card brand, if the `kind` value is `card`.
          example: Visa
        card_last_four:
          type: string
          description: The last four digits of the card. Present only when `kind` is `card`.
          example: "4242"
        expiry_date:
          type: string
          nullable: true
          description: |-
            The card expiry date in the `MM/YY` format, if the `kind` value is `card`.

            This value is `null` when the stored method does not have an expiry date.
          example: 06/30
        is_expired:
          type: boolean
          description: |-
            Whether that expiry date has passed, if the `kind` value is `card`.

            If the expiry date has passed, the client cannot pay using this method.
          example: false
        bank_name:
          type: string
          nullable: true
          description: |-
            The bank holding the account, if the `kind` value is `bank_account`.

            This value is `null` when the gateway did not supply bank information.
          example: STRIPE TEST BANK

    Invoice:
      type: object
      required:
        - id
        - status
      properties:
        id:
          type: integer
          format: int64
          example: 456
        invoice_number:
          type: string
          nullable: true
          example: "0001"
        date_created:
          type: string
          format: date
          nullable: true
          example: 2026-07-01
        date_due:
          type: string
          format: date
          nullable: true
          example: 2026-07-15
        status:
          type: string
          enum:
            - Draft
            - Unpaid
            - Payment Pending
            - Paid
            - Collections
            - Cancelled
            - Refunded
          example: Unpaid
          description: |-
            The payment lifecycle status.
            - `Paid` is the only accepted, terminal state. The order provisions on that transition.
            - `Payment Pending` indicates that payment is in progress but has not yet cleared. Keep polling until the status is `Paid`.

            Only `Unpaid` and `Collections` status invoices can be paid. The `POST /user/invoices/{invoice_id}/payment-link` and `POST /user/invoices/{invoice_id}/payment-session` endpoints refuse any other status with a `422` error.
        subtotal:
          type: number
          format: float
          example: 10.00
        total:
          type: number
          format: float
          example: 10.00
        balance:
          type: number
          format: float
          example: 10.00
        payment_method:
          type: string
          nullable: true
          example: stripe_dynamic

    NextAction:
      description: |-
        How to proceed with payment.

        - `redirect` returns a single-use hand-off `url` value (the default).
        - `payment_session` returns a `session` object that your integration passes to the matching gateway SDK and carries no `url` value.
      oneOf:
        - $ref: '#/components/schemas/NextActionRedirect'
        - $ref: '#/components/schemas/NextActionPaymentSession'

    NextActionRedirect:
      type: object
      required:
        - type
        - url
      properties:
        type:
          type: string
          enum:
            - redirect
        url:
          type: string
          example: https://example.com/oauth/singlesignon.php?access_token=...

    NextActionPaymentSession:
      type: object
      description: |-
        Returned when the checkout set the `payment.mode` value to `headless` for a gateway that supports it.
      required:
        - type
        - session
      properties:
        type:
          type: string
          enum:
            - payment_session
        session:
          $ref: '#/components/schemas/PaymentSession'

    PaymentSession:
      type: object
      description: |-
        A gateway-specific object of client-side parameters. The `params` keys depend on the `provider` value.
      required:
        - provider
        - params
        - settlement
        - sdk
      properties:
        provider:
          type: string
          description: |-
            A discriminator that tells your integration which gateway SDK to drive.
          example: stripe
        params:
          type: object
          additionalProperties: true
          description: |-
            The keys that the provider's SDK accepts.
          example:
            publishableKey: pk_live_...
            clientSecret: pi_3Abc..._secret_XyZ
            paymentIntentId: pi_3Abc...
            mode: payment
        settlement:
          type: string
          description: |-
            The method to use to settle payment. Branch on the value you receive rather than assuming one:

            - `sync_confirm` — Call the confirmation endpoint (`POST /user/invoices/{invoice_id}/payment-session/confirm`), which records the outcome in WHMCS.
            - `async_webhook` — Do not call the confirmation endpoint. The gateway module records the outcome when the provider's signed webhook arrives, so poll the `GET /user/invoices/{invoice_id}` endpoint until the status reaches `Paid`.

            After a `pending` result, poll regardless of this value. Success does not indicate that payment cleared.
          enum:
            - async_webhook
            - sync_confirm
          example: sync_confirm
        sdk:
          type: object
          additionalProperties: true
          description: |-
            The method to use to load the SDK that renders this session.
          required:
            - scriptUrl
          properties:
            scriptUrl:
              type: string
              description: |-
                The provider CDN URL your integration loads the SDK from.
              example: https://js.stripe.com/v3/
            apiVersion:
              type: string
              description: |-
                The gateway API version your integration must use so that the browser and WHMCS agree. The system returns this value for providers that accept it.
              example: '2023-10-16'
          example:
            scriptUrl: https://js.stripe.com/v3/
            apiVersion: '2023-10-16'

    InvoicePaymentSessionRequestBody:
      type: object
      description: |-
        A reference definition of the `POST /user/invoices/{invoice_id}/payment-session` endpoint's request body.
      properties:
        gateway:
          type: string
          description: |-
            The gateway module to pay with, if it is not the gateway already on the invoice.

            - Specifying a different gateway changes the gateway on the invoice and triggers the `InvoiceChangeGateway` hook. This requires that the installation allows clients to choose the payment method for invoices.
            - If you omit this value, send it empty, set it to `null`, or name the gateway the invoice already lists, payment uses the invoice's listed gateway and nothing changes on the invoice.

            The module that you specify must be available for the invoice:

            - It must support the invoice's currency.
            - It must support headless payments.
            - It must appear on the order form.
            - It must be available for the product groups for every product on the invoice.

            If you specify an invalid gateway, you will receive a `422` error status and no change will occur for the invoice.
          example: stripe_dynamic

    CheckoutRequestBody:
      type: object
      description: |-
        A reference definition of the `POST /cart/{cart_id}/checkout` endpoint's request body.
      properties:
        paymentmethod:
          type: string
          description: |-
            The name of the active payment gateway module.
          example: stripe_dynamic
        client_id:
          type: integer
          format: int64
          description: |-
            An existing client to check out as.

            You can supply this value **or** a `customer` value, but not both. Omit both to check out as the authenticated caller.
          example: 789
        customer:
          $ref: '#/components/schemas/CheckoutCustomer'
        payment:
          type: object
          properties:
            paymethod_id:
              type: integer
              format: int64
              description: |-
                The stored payment method ID, for `credit card` or `bank` gateways.

                If the gateway processes payments offline, the system will not honor this value and the payment status will be `pending`.

                This value takes precedence over the `mode` value.
              example: 12
            mode:
              type: string
              description: |-
                The payment mode:

                - `handoff` returns a single-use redirect to the WHMCS payment page.
                - `headless` requests a `payment_session` value from the gateway's SDK. The system returns a `422` error status if payment does not complete for one of the following reasons:
                  - The selected gateway can neither start a payment session nor capture a supplied `paymethod_id` value.
                  - The gateway supports payment sessions but the session failed to start due to a misconfiguration or an outage.
                  - The gateway declined a supplied `paymethod_id` value and no payment session could then be minted. A decline on its own answers a `failed` payment status carrying a `payment_session`, not a `422` error status.

                If you do not specify a value, the system defaults to `handoff`.
              enum:
                - handoff
                - headless
              default: handoff
              example: headless
        promo:
          type: string
          example: SUMMER10
        notes:
          type: string

    CheckoutCustomer:
      type: object
      description: |-
        Registers a new client as part of checkout.
      required:
        - firstname
        - lastname
        - email
        - password
      properties:
        firstname:
          type: string
          example: Jane
        lastname:
          type: string
          example: Doe
        email:
          allOf:
            - $ref: '#/components/schemas/Email'
        password:
          allOf:
            - $ref: '#/components/schemas/Password'
        companyname:
          type: string
          nullable: true
        address1:
          type: string
          nullable: true
        address2:
          type: string
          nullable: true
        city:
          type: string
          nullable: true
        state:
          type: string
          nullable: true
        postcode:
          type: string
          nullable: true
        country:
          type: string
          nullable: true
        phonenumber:
          type: string
          nullable: true
        customfields:
          type: object
          additionalProperties: true

    CheckoutPayment:
      type: object
      required:
        - method
        - status
      properties:
        method:
          type: string
          example: stripe_dynamic
        status:
          type: string
          description: |-
            `not_required` means the order created no invoice and there is nothing to collect, so `invoice_id` is `0` and `next_action` is `null`. A free billing cycle produces no invoice; an order discounted to zero is invoiced and answers `paid`.

            `failed` means the capture of the stored payment method did not succeed: the gateway declined it, or the attempt did not complete. Under a `payment.mode` value of `headless`, `next_action` carries a `payment_session` so that another method can be collected in place, and the request answers a `422` error status instead when no session can be minted; otherwise it carries a `redirect` to the hosted pay page.

            `failed` describes the attempt that did not succeed. Checking the same cart out again answers `paid` if the invoice settled in the meantime, `pending` once a payment is in flight, `action_required` with a freshly minted session while it is neither, and a `422` error status if a session cannot be minted again.
          enum:
            - paid
            - pending
            - action_required
            - not_required
            - failed
        next_action:
          type: object
          nullable: true
          allOf:
            - $ref: '#/components/schemas/NextAction'

    CheckoutResult:
      type: object
      required:
        - order_id
        - invoice_id
        - client_id
        - order_status
        - payment
      properties:
        order_id:
          type: integer
          format: int64
          example: 123
        invoice_id:
          type: integer
          format: int64
          description: |-
            `0` when the order created no invoice. Do not treat `0` as an error and do not request the invoice. A `payment.status` of `not_required` is the ordinary case; a free-cycle order held for fraud review reports `pending` with the same `0`.
          example: 456
        client_id:
          type: integer
          format: int64
          example: 789
        service_ids:
          type: array
          items:
            type: integer
            format: int64
        addon_ids:
          type: array
          items:
            type: integer
            format: int64
        domain_ids:
          type: array
          items:
            type: integer
            format: int64
        domain_renewal_ids:
          type: array
          description: |-
            The domains the checkout renewed. A renewal reuses the client's existing domain, so these identifiers are not new.
          items:
            type: integer
            format: int64
        service_renewal_ids:
          type: array
          description: |-
            The services the checkout renewed. A renewal reuses the client's existing service, so these identifiers are not new.
          items:
            type: integer
            format: int64
        addon_renewal_ids:
          type: array
          description: |-
            The addons the checkout renewed. A renewal reuses the client's existing addon, so these identifiers are not new.
          items:
            type: integer
            format: int64
        upgrade_ids:
          type: array
          description: |-
            The upgrades the checkout created.
          items:
            type: integer
            format: int64
        order_status:
          type: string
          example: Pending
        payment:
          $ref: '#/components/schemas/CheckoutPayment'
        url:
          type: string
          nullable: true
          description: |-
            Mirrors the `payment.next_action.url` value, for single-page application compatibility.

    Service:
      type: object
      required:
        - id
        - quantity
      properties:
        id:
          type: integer
          format: int64
          example: 789
        product:
          $ref: "#/components/schemas/Product"
        server:
          nullable: true
          allOf:
            - $ref: "#/components/schemas/Server"
        domain:
          type: string
          nullable: true
          example: example.com
        status:
          type: string
          example: pending
          nullable: true
        quantity:
          type: integer
          format: int32
          example: 1
        registration_date:
          type: string
          format: date
          example: 2022-03-14
        billing:
          $ref: '#/components/schemas/ServiceBillingExtended'
        addons:
          type: array
          items:
            $ref: '#/components/schemas/ServiceAddon'
        custom_fields:
          type: array
          items:
            $ref: '#/components/schemas/ServiceCustomField'
        config_options:
          type: array
          items:
            $ref: '#/components/schemas/ServiceConfigOption'
        renewal:
          $ref: '#/components/schemas/ServiceRenewal'

    ServiceAddon:
      type: object
      properties:
        id:
          type: integer
          format: int64
          example: 456
        addon:
          $ref: '#/components/schemas/Addon'
        service:
          type: object
          properties:
            id:
              type: integer
              format: int64
              example: 123
          required:
            - id
        quantity:
          type: integer
          format: int32
          nullable: true
        status:
          type: string
          example: Active
        registration_date:
          type: string
          format: date
          example: 2022-01-05
        billing:
          $ref: '#/components/schemas/ServiceBilling'
        renewal:
          $ref: '#/components/schemas/ServiceAddonRenewal'
      required:
        - id
        - billing

    ServiceConfigOptionBilling:
      type: object
      nullable: true
      properties:
        price:
          nullable: true
          allOf:
            - $ref: '#/components/schemas/ServicePrice'

    ServiceBilling:
      type: object
      nullable: true
      properties:
        cycle:
          $ref: '#/components/schemas/BillingCycle'
        price:
          nullable: true
          allOf:
            - $ref: '#/components/schemas/ServicePrice'
        payment_gateway:
          nullable: true
          allOf:
            - $ref: '#/components/schemas/PaymentGateway'
        next_due_date:
          type: string
          format: date
          example: 2022-05-01
          nullable: true

    ServiceBillingExtended:
      allOf:
        - type: object
          properties:
            promotions:
              type: array
              items:
                $ref: '#/components/schemas/Promotion'
          required:
            - promotions
        - $ref: "#/components/schemas/ServiceBilling"

    ServiceRenewal:
      type: object
      properties:
        id:
          type: integer
          format: int64
          example: 789
        type:
          type: string
          enum: [ service, addon ]
          example: service
        is_renewable:
          type: boolean
        non_renewable_reason:
          type: string
          nullable: true
          example: This service is not renewable because it has been cancelled.
        renewal_period:
          type: object
          properties:
            start:
              type: string
              format: date
              example: 2023-03-14
            end:
              type: string
              format: date
              example: 2024-04-14
          example: Active
        price:
          nullable: true
          allOf:
            - $ref: '#/components/schemas/Amount'
      required:
        - id
        - type
        - is_renewable
        - price

    ServiceAddonRenewal:
      allOf:
        - $ref: '#/components/schemas/ServiceRenewal'
        - type: object
          properties:
            type:
              type: string
              enum: [ addon ]
              example: addon
            non_renewable_reason:
              type: string
              nullable: true
              example: This service addon is not renewable because it has been cancelled.

    PaymentGateway:
      type: object
      properties:
        name:
          type: string
          description: Name of the payment gateway module.
          example: banktransfer
        description:
          type: string
          description: The friendly name of the payment gateway module.
          example: Bank Transfer
        supports_headless_payment_session:
          type: boolean
          description: |-
            Whether this gateway can return a `payment_session` value for a checkout that includes a `payment.mode` value of `headless`.

            - An integration that cannot follow a redirect should present only gateways where this value is true.
            - Sending `headless` to a gateway where it is false returns the hand-off redirect instead, or, when the `payment.mode` value is `headless`, a `422` error status.
          example: true
      required:
        - name

    CustomField:
      allOf:
        - $ref: "#/components/schemas/Entity"
        - type: object
          properties:
            type:
              type: string
              enum: [text, link, password, dropdown, checkbox, textarea]
              description: Field type
              example: text
            options:
              type: array
              nullable: true
              items:
                $ref: "#/components/schemas/CustomFieldValueType"
            validation:
              type: string
              nullable: true
              example:
            required:
              type: boolean
          required:
            - id
            - type
            - required

    CustomFieldValueType:
      description: Custom Field Value
      anyOf:
        - type: string
          example: DL123456789
        - type: boolean
          example: true

    ConfigOptionValueType:
      description: Configuration Option Value
      anyOf:
        - type: boolean
          example: true
          description: for yesno type, the value should be true or false
        - type: integer
          example: 1
          description: for quantity type, the value is the inputted numeric value while for radio and dropdown type, the value is the predefined option id
      nullable: true

    CartItemCustomField:
      allOf:
        - $ref: "#/components/schemas/CustomField"
        - type: object
          properties:
            value:
              $ref: "#/components/schemas/CustomFieldValueType"
          required:
            - value

    AdditionalFieldValueType:
      type: object
      description: Domain Additional Field Value
      properties:
        value:
          type: string
          example: C11
        display_name:
          type: string
          nullable: true
          example: C11 - United States Citizen

    AdditionalField:
      type: object
      properties:
        name:
          type: string
          nullable: true
          description: The name of Domain Additional Field
          example: Nexus Category
        required:
          oneOf:
            - type: boolean
              example: true
            - type: object
              additionalProperties:
                type: array
                items:
                  type: string
              example:
                Legal Type:
                  - UK Limited Company
                  - UK Public Limited Company

          nullable: true
          description: Whether the additional field is never required, always required, or conditionally required.
        type:
          type: string
          nullable: true
          enum: [ dropdown, radio, tickbox, text, display ]
          description: Additional Field type
          example: dropdown
        default:
          type: string
          nullable: true
          description: The default input field value
          example: C11
        options:
          type: array
          nullable: true
          description: Certain Domain Additional Field types have predefined options
          items:
            $ref: "#/components/schemas/AdditionalFieldValueType"

    ServiceCustomField:
      type: object
      properties:
        id:
          type: integer
          format: int64
          example: 456
        custom_field:
          $ref: '#/components/schemas/CustomField'
        service:
          type: object
          properties:
            id:
              type: integer
              format: int64
              example: 123
          required:
            - id
        value:
          $ref: '#/components/schemas/CustomFieldValueType'
      required:
        - id
        - custom_field

    ConfigOptionType:
      type: string
      enum: [dropdown, radio, yesno, quantity]
      description: Config option type
      example: dropdown

    ConfigOption:
      allOf:
        - $ref: "#/components/schemas/Entity"
        - type: object
          properties:
            type:
              $ref: "#/components/schemas/ConfigOptionType"
            quantity_minimum:
              type: integer
              format: int32
              nullable: true
              example: 1
            quantity_maximum:
              type: integer
              format: int32
              nullable: true
              example: 99
            sort_order:
              type: integer
              format: int32
              example: 1
            group:
              nullable: true
              allOf:
                - $ref: '#/components/schemas/Group'
