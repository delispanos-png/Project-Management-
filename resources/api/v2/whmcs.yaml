          content:
            application/json:
              schema:
                required:
                  - data
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/AdminClient'
        default:
          $ref: '#/components/responses/GeneralError'

  /admin/users/search:
    get:
      description: Find users matching a search query.
      parameters:
        - $ref: "#/components/parameters/search_query"
        - $ref: "#/components/parameters/page"
        - $ref: "#/components/parameters/page_size"
      responses:
        200:
          description: User list
          content:
            application/json:
              schema:
                required:
                  - data
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/AdminUser'
        default:
          $ref: '#/components/responses/GeneralError'

  /admin/clients/{client_id}/session:
    post:
      description: Masquerade as the owner of the client specified by client ID.
      parameters:
        - $ref: "#/components/parameters/client_id"
      responses:
        200:
          description: Logged in user data
          content:
            application/json:
              schema:
                required:
                  - data
                properties:
                  data:
                    $ref: '#/components/schemas/AdminUser'
        default:
          $ref: '#/components/responses/GeneralError'

  /admin/users/{user_id}/session:
    post:
      description: Masquerade as a client owned by a user specified by user ID.
      parameters:
        - $ref: "#/components/parameters/user_id"
      responses:
        200:
          description: Logged in user data
          content:
            application/json:
              schema:
                required:
                  - data
                properties:
                  data:
                    $ref: '#/components/schemas/AdminUser'
        default:
          $ref: '#/components/responses/GeneralError'
components:
  schemas:
    Meta:
      oneOf:
        - type: object
          properties:
            total_items:
              type: integer
              example: 10
              description: The total number of results available.
            page:
              type: integer
              example: 1
            total_pages:
              type: integer
              example: 1
            page_size:
              type: integer
              example: 50
              description: The current number of results per page.
          required:
            - total_items
            - page
            - total_pages
            - page_size
        - type: array
          items: {}
          minItems: 0
          maxItems: 0

    GeneralError:
      type: object
      properties:
        message:
          type: string

    CartItemId:
      description: Unique cart item ID. It is automatically generated when an item is added to cart.
      type: string
      minLength: 8
      maxLength: 16

    CartItemTypeProductRequest:
      type: object
      properties:
        type:
          type: string
          enum: [product]
          example: product
        product_id:
          type: integer
          format: int64
          example: 123
        billing_cycle:
          $ref: '#/components/schemas/BillingCycle'
        quantity:
          type: integer
          format: int32
          example: 5
        domain:
          type: string
          nullable: true
          example: example.com
        addons:
          type: array
          items:
            $ref: '#/components/schemas/CartItemTypeProductAddonRequest'
        custom_fields:
          type: array
          items:
            $ref: '#/components/schemas/CartItemTypeProductCustomFieldRequest'
        config_options:
          type: array
          items:
            $ref: '#/components/schemas/CartItemTypeProductConfigOptionRequest'
      required:
        - type
        - product_id
        - billing_cycle

    CartItemTypeProductEdit:
      type: object
      properties:
        type:
          type: string
          enum: [product]
          example: product
        quantity:
          type: integer
          format: int32
          example: 5
          nullable: true
        billing_cycle:
          $ref: '#/components/schemas/BillingCycle'
      required:
        - billing_cycle

    CartItemTypeBundleProductRequest:
      type: object
      properties:
        type:
          type: string
          enum: [product]
          example: product
        product_id:
          type: integer
          format: int64
          example: 123
        billing_cycle:
          $ref: '#/components/schemas/BillingCycle'
        quantity:
          type: integer
          format: int32
          example: 5
        domain:
          anyOf:
            - type: string
            - $ref: '#/components/schemas/CartItemTypeDomainRegisterRequest'
            - $ref: '#/components/schemas/CartItemTypeDomainTransferRequest'
          nullable: true
        addons:
          type: array
          items:
            $ref: '#/components/schemas/CartItemTypeProductAddonRequest'
        custom_fields:
          type: array
          items:
            $ref: '#/components/schemas/CartItemTypeProductCustomFieldRequest'
        config_options:
          type: array
          items:
            $ref: '#/components/schemas/CartItemTypeProductConfigOptionRequest'
      required:
        - type
        - product_id
        - billing_cycle

    CartItemTypeBundleRequest:
      type: object
      properties:
        type:
          type: string
          enum: [bundle]
          example: bundle
        id:
          type: integer
          format: int64
          example: 123
        items:
          type: array
          items:
            anyOf:
              - $ref: '#/components/schemas/CartItemTypeBundleProductRequest'
              - $ref: '#/components/schemas/CartItemTypeDomainRegisterRequest'
              - $ref: '#/components/schemas/CartItemTypeDomainTransferRequest'
      required:
        - type
        - id

    CartItemTypeBundleProduct:
      type: object
      properties:
        item_id:
          $ref: "#/components/schemas/CartItemId"
        type:
          type: string
          enum: [product]
          example: product
        quantity:
          type: integer
          format: int32
          example: 5
        domain:
          anyOf:
            - type: string
            - $ref: '#/components/schemas/CartItemTypeDomainRegister'
            - $ref: '#/components/schemas/CartItemTypeDomainTransfer'
          nullable: true
        product:
          $ref: "#/components/schemas/Product"
        billing:
          $ref: '#/components/schemas/CartItemBilling'
        addons:
          type: array
          items:
            $ref: '#/components/schemas/CartItemTypeProductAddon'
        custom_fields:
          type: array
          items:
            $ref: '#/components/schemas/CartItemCustomField'
        config_options:
          type: array
          items:
            $ref: '#/components/schemas/CartItemTypeProductConfigOption'
      required:
        - item_id
        - product
        - billing
        - quantity

    CartItemTypeProduct:
      type: object
      properties:
        item_id:
          $ref: "#/components/schemas/CartItemId"
        type:
          type: string
          enum: [product]
          example: product
        quantity:
          type: integer
          format: int32
          example: 5
        domain:
          type: string
          nullable: true
          example: example.com
        product:
          $ref: "#/components/schemas/Product"
        billing:
          $ref: '#/components/schemas/CartItemBilling'
        addons:
          type: array
          items:
            $ref: '#/components/schemas/CartItemTypeProductAddon'
        custom_fields:
          type: array
          items:
            $ref: '#/components/schemas/CartItemCustomField'
        config_options:
          type: array
          items:
            $ref: '#/components/schemas/CartItemTypeProductConfigOption'
      required:
        - item_id
        - product
        - billing
        - quantity

    CartItemTypeBundle:
      type: object
      properties:
        type:
          type: string
          enum: [bundle]
          example: bundle
        id:
          type: integer
          format: int64
        name:
          type: string
          description: The bundle display name
          example: Starter Hosting Bundle
        items:
          type: array
          items:
            anyOf:
              - $ref: '#/components/schemas/CartItemTypeBundleProduct'
              - $ref: '#/components/schemas/CartItemTypeDomainRegister'
              - $ref: '#/components/schemas/CartItemTypeDomainTransfer'
      required:
        - id
        - type

    CartItemTypeProductAddonRequest:
      type: object
      properties:
        id:
          type: integer
          format: int64
          example: 456
        quantity:
          type: integer
          format: int32
          example: 5
      required:
        - id

    CartItemTypeProductCustomFieldRequest:
      type: object
      properties:
        id:
          type: integer
          format: int64
          example: 456
        value:
          $ref: "#/components/schemas/CustomFieldValueType"
      required:
        - id
        - value

    CartItemTypeProductConfigOptionRequest:
      type: object
      properties:
        id:
          type: integer
          format: int64
          example: 456
        value:
          $ref: "#/components/schemas/ConfigOptionValueType"
      required:
        - id
        - value

    CartItemTypeDomain:
      type: object
      properties:
        type:
          type: string
          enum: [ domain_register, domain_transfer, domain_renewal ]
          example: domain_register
        period:
          type: integer
